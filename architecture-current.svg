<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
  <title id="title">FinInsRAG 当前实际架构图</title>
  <desc id="desc">金融文档 RAG 的上传索引和问答检索生成两条实际链路。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#1a73e8"/><stop offset="1" stop-color="#7b61ff"/></linearGradient>
    <linearGradient id="api" x1="0" x2="1"><stop stop-color="#e8f1ff"/><stop offset="1" stop-color="#dcecff"/></linearGradient>
    <linearGradient id="ingest" x1="0" x2="1"><stop stop-color="#fff7db"/><stop offset="1" stop-color="#ffedb2"/></linearGradient>
    <linearGradient id="rag" x1="0" x2="1"><stop stop-color="#e7f9ff"/><stop offset="1" stop-color="#cdeeff"/></linearGradient>
    <linearGradient id="external" x1="0" x2="1"><stop stop-color="#fff0f5"/><stop offset="1" stop-color="#ffe0eb"/></linearGradient>
    <linearGradient id="storage" x1="0" x2="1"><stop stop-color="#fff3e0"/><stop offset="1" stop-color="#ffe0bd"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#1f2937" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52647a"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#152238}
      .section{stroke-width:2;stroke-dasharray:7 6;rx:22}.node{stroke-width:2;filter:url(#shadow);rx:14}.edge{fill:none;stroke:#52647a;stroke-width:2.4;marker-end:url(#arrow)}
      .label{font-size:20px;font-weight:700;text-anchor:middle}.sub{font-size:14px;fill:#52647a;text-anchor:middle}.tiny{font-size:13px;fill:#52647a;text-anchor:middle}.section-title{font-size:21px;font-weight:800}.pill{font-size:13px;font-weight:700;text-anchor:middle}
    </style>
  </defs>

  <rect width="1920" height="1240" fill="#f8fafc"/>
  <rect x="40" y="24" width="1840" height="78" rx="20" fill="url(#header)"/>
  <text x="960" y="70" font-size="32" font-weight="800" fill="white" text-anchor="middle">FinInsRAG · 当前实际架构</text>
  <text x="960" y="92" font-size="15" fill="#e9efff" text-anchor="middle">文档上传与索引 ｜ 混合召回、重排与流式证据问答</text>

  <!-- zones -->
  <rect class="section" x="40" y="130" width="1840" height="350" fill="#fffdf7" stroke="#eab308"/>
  <text class="section-title" x="72" y="166">① 文档上传与索引链路</text>
  <rect class="section" x="40" y="510" width="1840" height="450" fill="#f7fcff" stroke="#38bdf8"/>
  <text class="section-title" x="72" y="546">② 对话问答与检索生成链路</text>
  <rect class="section" x="40" y="990" width="1840" height="210" fill="#fffaf5" stroke="#fb923c"/>
  <text class="section-title" x="72" y="1026">③ 数据与外部服务</text>

  <!-- client and API -->
  <g>
    <rect class="node" x="80" y="250" width="190" height="84" fill="url(#api)" stroke="#3b82f6"/>
    <text class="label" x="175" y="284">🖥️ 前端</text><text class="sub" x="175" y="310">React + Vite</text>
    <rect class="node" x="350" y="250" width="205" height="84" fill="url(#api)" stroke="#2563eb"/>
    <text class="label" x="452" y="284">⚡ FastAPI</text><text class="sub" x="452" y="310">chat_rt.py / SSE</text>
    <path class="edge" d="M270 276 H350"/><path class="edge" d="M350 312 H270" marker-end="url(#arrow)"/>
  </g>

  <!-- ingestion -->
  <g>
    <rect class="node" x="650" y="210" width="195" height="104" fill="url(#ingest)" stroke="#d97706"/>
    <text class="label" x="747" y="247">📤 上传与去重</text><text class="sub" x="747" y="274">文件哈希 · 文档记录</text><text class="tiny" x="747" y="295">ingestion.py</text>
    <rect class="node" x="930" y="210" width="200" height="104" fill="url(#ingest)" stroke="#d97706"/>
    <text class="label" x="1030" y="247">📄 DOCX / PDF 解析</text><text class="sub" x="1030" y="274">parse_blocks()</text><text class="tiny" x="1030" y="295">原始结构块</text>
    <rect class="node" x="1215" y="210" width="215" height="104" fill="url(#ingest)" stroke="#d97706"/>
    <text class="label" x="1322" y="247">🧩 结构感知分块</text><text class="sub" x="1322" y="274">title · heading_path</text><text class="tiny" x="1322" y="295">structure_aware_chunks()</text>
    <rect class="node" x="1515" y="210" width="260" height="104" fill="url(#ingest)" stroke="#d97706"/>
    <text class="label" x="1645" y="247">🎯 向量化并写入索引</text><text class="sub" x="1645" y="274">Chunk + 1024 维向量</text><text class="tiny" x="1645" y="295">rag_chunks_v2</text>
    <path class="edge" d="M555 276 H650"/><path class="edge" d="M845 262 H930"/><path class="edge" d="M1130 262 H1215"/><path class="edge" d="M1430 262 H1515"/>
  </g>

  <!-- chat pipeline -->
  <g>
    <rect class="node" x="80" y="670" width="190" height="92" fill="url(#api)" stroke="#3b82f6"/>
    <text class="label" x="175" y="707">💬 用户问题</text><text class="sub" x="175" y="734">会话 / 指代追问</text>
    <rect class="node" x="350" y="670" width="205" height="92" fill="url(#api)" stroke="#2563eb"/>
    <text class="label" x="452" y="707">⚡ Chat API</text><text class="sub" x="452" y="734">加载历史与文档范围</text>
    <rect class="node" x="635" y="670" width="190" height="92" fill="url(#rag)" stroke="#0284c7"/>
    <text class="label" x="730" y="707">✍️ Query 改写</text><text class="sub" x="730" y="734">历史仅辅助理解</text>
    <path class="edge" d="M270 716 H350"/><path class="edge" d="M555 716 H635"/>

    <rect class="node" x="885" y="592" width="195" height="86" fill="url(#rag)" stroke="#0284c7"/>
    <text class="label" x="982" y="626">🔤 BM25 召回</text><text class="sub" x="982" y="651">Top 30 · 关键词</text>
    <rect class="node" x="885" y="765" width="195" height="86" fill="url(#rag)" stroke="#0284c7"/>
    <text class="label" x="982" y="799">🔢 Dense 召回</text><text class="sub" x="982" y="824">Top 30 · 语义向量</text>
    <path class="edge" d="M825 700 C850 700 850 635 885 635"/><path class="edge" d="M825 732 C850 732 850 808 885 808"/>

    <rect class="node" x="1160" y="670" width="180" height="92" fill="url(#rag)" stroke="#0284c7"/>
    <text class="label" x="1250" y="707">🔀 RRF 融合</text><text class="sub" x="1250" y="734">双路去重 Top 20</text>
    <path class="edge" d="M1080 635 C1120 635 1120 700 1160 700"/><path class="edge" d="M1080 808 C1120 808 1120 732 1160 732"/>
    <rect class="node" x="1415" y="670" width="190" height="92" fill="url(#rag)" stroke="#0284c7"/>
    <text class="label" x="1510" y="707">🏆 Rerank</text><text class="sub" x="1510" y="734">gte-rerank-v2 · Top 8</text>
    <path class="edge" d="M1340 716 H1415"/>
    <rect class="node" x="1665" y="670" width="175" height="92" fill="url(#rag)" stroke="#0284c7"/>
    <text class="label" x="1752" y="707">📚 Context</text><text class="sub" x="1752" y="734">Packing → Evidence</text>
    <path class="edge" d="M1605 716 H1665"/>
  </g>

  <!-- Generation return -->
  <g>
    <rect class="node" x="1180" y="855" width="250" height="82" fill="url(#external)" stroke="#db2777"/>
    <text class="label" x="1305" y="889">🤖 DeepSeek V4 Flash</text><text class="sub" x="1305" y="914">Thinking · content / reasoning_content</text>
    <path class="edge" d="M1752 762 C1752 842 1450 815 1430 877"/>
    <path class="edge" d="M1180 896 C920 896 760 896 555 748"/>
    <path class="edge" d="M350 748 C315 748 310 716 270 716"/>
    <text class="pill" x="880" y="883" fill="#52647a">SSE 流式事件：reasoning / content / sources</text>
  </g>

  <!-- data & providers -->
  <g>
    <rect class="node" x="160" y="1080" width="250" height="82" fill="url(#storage)" stroke="#ea580c"/>
    <text class="label" x="285" y="1113">🐘 PostgreSQL</text><text class="sub" x="285" y="1139">用户 · 会话 · 消息 · 文档元数据</text>
    <rect class="node" x="520" y="1080" width="260" height="82" fill="url(#storage)" stroke="#ea580c"/>
    <text class="label" x="650" y="1113">🔎 Elasticsearch</text><text class="sub" x="650" y="1139">rag_chunks_v2 · 文本 / 元数据 / 向量</text>
    <rect class="node" x="890" y="1080" width="205" height="82" fill="url(#storage)" stroke="#ea580c"/>
    <text class="label" x="992" y="1113">🔴 Redis</text><text class="sub" x="992" y="1139">引用检查反馈 TTL</text>
    <rect class="node" x="1205" y="1080" width="245" height="82" fill="url(#external)" stroke="#db2777"/>
    <text class="label" x="1327" y="1113">☁️ DashScope</text><text class="sub" x="1327" y="1139">text-embedding-v3 · gte-rerank-v2</text>
    <rect class="node" x="1560" y="1080" width="210" height="82" fill="url(#storage)" stroke="#ea580c"/>
    <text class="label" x="1665" y="1113">📁 本地存储</text><text class="sub" x="1665" y="1139">原始上传文件</text>
    <path class="edge" d="M452 334 V1045 H285 V1080"/><path class="edge" d="M1645 314 V1025 H650 V1080"/><path class="edge" d="M982 765 V1025"/><path class="edge" d="M1510 762 V1025 H1327 V1080"/><path class="edge" d="M452 762 V1025 H992 V1080"/><path class="edge" d="M747 314 V1025 H1665 V1080"/>
  </g>

  <rect x="1510" y="135" width="335" height="42" rx="21" fill="#e8f1ff" stroke="#8ab4f8"/>
  <text class="pill" x="1678" y="162">实线：请求 / 数据流　虚线框：功能分区</text>
</svg>
